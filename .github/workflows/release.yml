name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirm tag matches package version
        shell: pwsh
        run: |
          $expected = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag $env:GITHUB_REF_NAME must match $expected" }
      - run: npm ci
      - run: npm test
      - name: Download verified Android companion
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force mobile/downloads | Out-Null
          gh release download mobile-v1.1.2 --repo frnaky-op/EasyPOS --pattern 'EasyPOS-Mobile.*' --dir mobile/downloads
          if ($LASTEXITCODE -ne 0) { throw "Could not download the Android companion" }
          node scripts/verify-mobile-download.js
      - name: Build Windows installer
        run: npm run electron-build
      - name: Publish Windows installer and update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            "dist/EasyPOS-Setup-$version-x64.exe",
            "dist/EasyPOS-Setup-$version-x64.exe.blockmap",
            "dist/latest.yml",
            "mobile/downloads/EasyPOS-Mobile.apk",
            "mobile/downloads/EasyPOS-Mobile.json"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Release asset missing: $asset" }
          }
          $notes = "docs/releases/$version.md"
          $releases = gh release list --repo frnaky-op/EasyPOS --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing releases" }
          $exists = @($releases | Where-Object { $_.tagName -eq $tag }).Count -gt 0
          if ($exists) {
            gh release upload $tag @assets --repo frnaky-op/EasyPOS --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not upload release assets" }
            if (Test-Path $notes) {
              gh release edit $tag --repo frnaky-op/EasyPOS --title $version --notes-file $notes
              if ($LASTEXITCODE -ne 0) { throw "Could not update release notes" }
            }
          } else {
            if (Test-Path $notes) {
              gh release create $tag @assets --repo frnaky-op/EasyPOS --title $version --notes-file $notes --latest
            } else {
              gh release create $tag @assets --repo frnaky-op/EasyPOS --title $version --generate-notes --latest
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub release" }
          }
